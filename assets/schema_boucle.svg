<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 470" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
  <rect width="1240" height="470" fill="#f7fbfb"/>
  <text x="620" y="42" text-anchor="middle" font-size="24" font-weight="bold" fill="#0b3c42">RATISS-PLANCK — la boucle refermée : de la longueur de Planck au chat-12</text>
  <text x="620" y="66" text-anchor="middle" font-size="13" fill="#5b6b73">29 septembre 2026 · Yaoundé · une journée, une chaîne de calcul, trois machines quantiques</text>

  <!-- chaîne de 6 boîtes -->
  <g font-size="14">
    <rect x="30"  y="110" width="180" height="84" rx="12" fill="#0d7377"/>
    <text x="120" y="143" text-anchor="middle" fill="#ffffff" font-weight="bold">1899 · Planck</text>
    <text x="120" y="166" text-anchor="middle" fill="#d2f0f0">ℓ_P = √(ħG/c³)</text>

    <rect x="240" y="110" width="180" height="84" rx="12" fill="#12606b"/>
    <text x="330" y="143" text-anchor="middle" fill="#ffffff" font-weight="bold">Le mur</text>
    <text x="330" y="166" text-anchor="middle" fill="#d2f0f0">√2·ℓ_P · E_P/√2</text>

    <rect x="450" y="110" width="180" height="84" rx="12" fill="#3d7a5f"/>
    <text x="540" y="143" text-anchor="middle" fill="#ffffff" font-weight="bold">Le qubit</text>
    <text x="540" y="166" text-anchor="middle" fill="#e2f4ea">Landauer · GUP</text>

    <rect x="660" y="110" width="180" height="84" rx="12" fill="#6c5b9e"/>
    <text x="750" y="143" text-anchor="middle" fill="#ffffff" font-weight="bold">Page · Unruh</text>
    <text x="750" y="166" text-anchor="middle" fill="#e6e0f5">entropie · équivalence</text>

    <rect x="870" y="110" width="180" height="84" rx="12" fill="#8a6d2f"/>
    <text x="960" y="143" text-anchor="middle" fill="#ffffff" font-weight="bold">3 QPU réels</text>
    <text x="960" y="166" text-anchor="middle" fill="#f5e9cf">IBEX · Garnet · Cepheus</text>

    <rect x="1080" y="110" width="130" height="84" rx="12" fill="#d9a441"/>
    <text x="1145" y="143" text-anchor="middle" fill="#ffffff" font-weight="bold">Le chat-12</text>
    <text x="1145" y="166" text-anchor="middle" fill="#fdf3dd">66,0 %</text>
  </g>

  <!-- flèches -->
  <g stroke="#33484d" stroke-width="2.5" fill="none">
    <line x1="210" y1="152" x2="236" y2="152"/><polygon points="236,147 244,152 236,157" fill="#33484d"/>
    <line x1="420" y1="152" x2="446" y2="152"/><polygon points="446,147 454,152 446,157" fill="#33484d"/>
    <line x1="630" y1="152" x2="656" y2="152"/><polygon points="656,147 664,152 656,157" fill="#33484d"/>
    <line x1="840" y1="152" x2="866" y2="152"/><polygon points="866,147 874,152 866,157" fill="#33484d"/>
    <line x1="1050" y1="152" x2="1076" y2="152"/><polygon points="1076,147 1084,152 1076,157" fill="#33484d"/>
  </g>

  <!-- flèche de retour -->
  <path d="M 1145 194 C 1145 290, 120 290, 120 198" stroke="#b0472f" stroke-width="2.5" fill="none" stroke-dasharray="7 5"/>
  <polygon points="115,200 120,190 126,200" fill="#b0472f"/>
  <text x="632" y="282" text-anchor="middle" font-size="14" fill="#b0472f" font-style="italic">une seule physique, du 10⁻³⁵ m à l'ion — la boucle est refermée</text>

  <!-- bande méthode -->
  <rect x="30" y="330" width="1180" height="110" rx="12" fill="#ffffff" stroke="#cfe0e3"/>
  <text x="620" y="360" text-anchor="middle" font-size="15" font-weight="bold" fill="#0b3c42">LA MÉTHODE DU JOUR (doctrine du chef)</text>
  <g font-size="13" fill="#33484d">
    <text x="70"  y="392">① tir 1 par 1 : Garnet → Cepheus → IBEX</text>
    <text x="70"  y="416">② devis lu AVANT approbation (1 · 2 · 15 crédits)</text>
    <text x="530" y="392">③ job long = workflow sauvé, on revient demain</text>
    <text x="530" y="416">④ échecs publiés · zéro chiffre non calculé</text>
    <text x="950" y="392">⑤ 14 jobs · ~11 264 tirs réels</text>
    <text x="950" y="416">⑥ 40/40 tests verts · 12 figures issues du calcul</text>
  </g>
</svg>
